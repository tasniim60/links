<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tasneem Eldeeb Links</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    :root {
      --paper: #f5f4ef;
      --surface: #fcfbf8;
      --ink: #282721;
      --muted: #77766d;
      --sage: #7d9a87;
      --sage-dark: #567461;
      --hairline: rgba(40, 39, 33, .13);
      --font-body: "DM Sans", sans-serif;
      --font-display: "Playfair Display", serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      color-scheme: light;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-width: 320px;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 50;
      opacity: .045;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.32'/%3E%3C/svg%3E");
    }

    body {
      min-height: 100dvh;
      background:
        radial-gradient(circle at 12% 18%, rgba(215, 225, 214, .42), transparent 28rem),
        radial-gradient(circle at 90% 82%, rgba(232, 225, 210, .32), transparent 30rem),
        var(--paper);
      color: var(--ink);
      font-family: var(--font-body);
      display: grid;
      place-items: center;
      padding: 48px max(20px, env(safe-area-inset-left, 0px)) 48px max(20px, env(safe-area-inset-right, 0px));
    }

    .card {
      width: min(100%, 980px);
      padding: 8px;
      border: 1px solid rgba(36, 34, 29, .1);
      border-radius: 34px;
      background: rgba(255, 255, 255, .5);
      box-shadow: 0 28px 80px rgba(67, 59, 45, .08);
      animation: rise-in 900ms cubic-bezier(.32, .72, 0, 1) both;
    }

    .card-core {
      min-height: 600px;
      padding: clamp(28px, 5vw, 72px);
      border-radius: 27px;
      background: rgba(252, 251, 248, .98);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, .9);
      display: grid;
      grid-template-columns: .9fr 1.1fr;
      gap: clamp(44px, 8vw, 112px);
      align-items: center;
    }

    .id {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .avatar {
      position: relative;
      width: 188px;
      height: 232px;
      border-radius: 28px;
      overflow: hidden;
      background: #fdfcf9;
      margin-bottom: 26px;
      display: grid;
      place-items: center;
      font: 600 42px var(--font-display);
      color: var(--sage-dark);
      box-shadow: 0 0 0 8px rgba(125, 154, 135, .1), inset 0 1px 1px rgba(255, 255, 255, .9);
    }

    .avatar img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 18%;
      display: block;
    }

    h1 {
      max-width: 340px;
      font: 600 clamp(38px, 5vw, 64px)/.98 var(--font-display);
      letter-spacing: -.045em;
      margin: 0;
      text-align: center;
    }

    .role {
      margin: 16px 0 0;
      color: var(--muted);
      font-size: 14px;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .eyebrow {
      margin: 0 0 18px;
      color: var(--sage-dark);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    .links-panel {
      width: 100%;
    }

    .actions {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 64px;
      padding: 10px 12px 10px 20px;
      border-radius: 999px;
      border: 1px solid var(--hairline);
      background: transparent;
      color: var(--ink);
      font-weight: 500;
      font-size: 15px;
      text-decoration: none;
      transition: transform 650ms cubic-bezier(.32, .72, 0, 1), background-color 650ms cubic-bezier(.32, .72, 0, 1), color 650ms cubic-bezier(.32, .72, 0, 1), border-color 650ms cubic-bezier(.32, .72, 0, 1);
    }

    .btn svg {
      width: 18px;
      height: 18px;
      flex: none;
    }

    .btn.primary {
      background: var(--sage-dark);
      color: #fff;
      border-color: var(--sage-dark);
    }

    .btn:hover {
      transform: translateY(-3px);
      border-color: var(--sage);
      background: rgba(125, 154, 135, .12);
    }

    .btn.primary:hover {
      background: var(--sage);
      border-color: var(--sage);
    }

    .btn .action-arrow {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      margin-left: auto;
      background: rgba(36, 34, 29, .07);
      font-size: 14px;
      transition: transform 650ms cubic-bezier(.32, .72, 0, 1), background-color 650ms cubic-bezier(.32, .72, 0, 1);
    }

    .btn.primary .action-arrow {
      background: rgba(255, 255, 255, .14);
    }

    .btn:hover .action-arrow {
      transform: translate(3px, -2px) scale(1.06);
      background: rgba(125, 154, 135, .2);
    }

    .btn.primary:hover .action-arrow {
      background: rgba(255, 255, 255, .22);
    }

    .btn:focus-visible,
    .soc:focus-visible {
      outline: 2px solid var(--sage);
      outline-offset: 5px;
    }

    .socials {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-start;
      gap: 6px;
      margin-top: 30px;
    }

    .soc {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: var(--muted);
      transition: color 650ms cubic-bezier(.32, .72, 0, 1), background-color 650ms cubic-bezier(.32, .72, 0, 1), transform 650ms cubic-bezier(.32, .72, 0, 1);
    }

    .soc svg {
      width: 21px;
      height: 21px;
      fill: currentColor;
    }

    .soc:hover {
      color: var(--sage-dark);
      background: rgba(125, 154, 135, .16);
      transform: translateY(-3px);
    }

    .reveal {
      animation: rise-in 850ms cubic-bezier(.32, .72, 0, 1) both;
    }

    .reveal:nth-child(2) {
      animation-delay: 120ms;
    }

    @keyframes rise-in {
      from {
        opacity: 0;
        transform: translateY(28px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 700px) {
      body {
        padding: 16px 12px 24px;
        place-items: start center;
      }

      .card {
        width: 100%;
        border-radius: 26px;
      }

      .card-core {
        min-height: calc(100dvh - 56px);
        grid-template-columns: 1fr;
        gap: 52px;
        padding: 44px 18px 28px;
        border-radius: 20px;
        align-content: center;
      }

      .avatar {
        width: 142px;
        height: 176px;
        font-size: 32px;
        margin-bottom: 18px;
      }

      h1 {
        max-width: 280px;
        font-size: clamp(42px, 12vw, 54px);
      }

      .role {
        margin-top: 13px;
        font-size: 11px;
        letter-spacing: .14em;
      }

      .eyebrow {
        margin-bottom: 14px;
      }

      .btn {
        min-height: 60px;
        padding-left: 18px;
        font-size: 14px;
      }

      .btn .action-arrow {
        width: 36px;
        height: 36px;
      }

      .socials {
        margin-top: 24px;
        gap: 4px;
      }

      .links-panel {
        width: 100%;
      }

      .socials {
        justify-content: center;
      }
    }

    @media (max-width: 380px) {
      .card-core {
        gap: 42px;
        padding-inline: 14px;
      }

      .avatar {
        width: 126px;
        height: 156px;
      }

      .btn {
        min-height: 56px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>

</head>

<body>

      <section class="id reveal">
        <div class="avatar"><span aria-hidden="true">T</span><img id="photo" src="mine.png" alt=""></div>
        <h1>Tasneem Eldeeb</h1>
        <p class="role">Full-Stack Developer</p>
      </section>
      <section class="links-panel reveal">
        <p class="eyebrow">Selected links</p>

    </div>
